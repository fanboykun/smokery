name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_commit.message, '[skip-release]'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if core files changed
        if: github.event_name == 'workflow_run'
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^(apps/core/|configs/Dockerfile)' || true)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no core changes
        if: github.event_name == 'workflow_run' && steps.changes.outputs.skip == 'true'
        run: echo "No core file changes, skipping release." && exit 0

      - name: Determine next version
        if: steps.changes.outputs.skip != 'true'
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          fallbackTag: v0.0.0
          noVersionBumpBehavior: patch
          noNewCommitBehavior: current
          patchAll: ${{ github.event_name == 'workflow_run' }}
          additionalCommits: |
            ${{ github.event.inputs.bump == 'major' && 'feat!: manual major release' || '' }}
            ${{ github.event.inputs.bump == 'minor' && 'feat: manual minor release' || '' }}
            ${{ github.event.inputs.bump == 'patch' && 'fix: manual patch release' || '' }}

      - name: Skip if no new version
        if: steps.changes.outputs.skip != 'true' && steps.semver.outputs.next == steps.semver.outputs.current
        run: echo "No version change, skipping."

      - uses: actions/setup-go@v5
        if: steps.changes.outputs.skip != 'true' && steps.semver.outputs.next != steps.semver.outputs.current
        with:
          go-version: "1.26"
          cache-dependency-path: apps/core/go.sum

      - name: Build CLI binaries
        if: steps.changes.outputs.skip != 'true' && steps.semver.outputs.next != steps.semver.outputs.current
        working-directory: apps/core
        run: |
          VERSION=${{ steps.semver.outputs.next }}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o ../../dist/smokery-linux-amd64 ./cmd/smokery
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o ../../dist/smokery-linux-arm64 ./cmd/smokery
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o ../../dist/smokery-darwin-amd64 ./cmd/smokery
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o ../../dist/smokery-darwin-arm64 ./cmd/smokery
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o ../../dist/smokery-windows-amd64.exe ./cmd/smokery

      - name: Create tag and release
        if: steps.changes.outputs.skip != 'true' && steps.semver.outputs.next != steps.semver.outputs.current
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.next }}
          generate_release_notes: true
          files: dist/*
