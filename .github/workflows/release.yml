name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_commit.message, '[skip-release]'))
    outputs:
      next: ${{ steps.semver.outputs.next }}
      current: ${{ steps.semver.outputs.current }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if core files changed
        if: github.event_name == 'workflow_run'
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^(apps/core/|configs/Dockerfile)' || true)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine next version
        if: steps.changes.outputs.skip != 'true'
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          fallbackTag: v0.0.0
          noVersionBumpBehavior: patch
          noNewCommitBehavior: current
          patchAll: ${{ github.event_name == 'workflow_run' }}
          additionalCommits: |
            ${{ github.event.inputs.bump == 'major' && 'feat!: manual major release' || '' }}
            ${{ github.event.inputs.bump == 'minor' && 'feat: manual minor release' || '' }}
            ${{ github.event.inputs.bump == 'patch' && 'fix: manual patch release' || '' }}

      - name: Decide if release needed
        id: decide
        run: |
          if [ "${{ steps.changes.outputs.skip }}" = "true" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.semver.outputs.next }}" = "${{ steps.semver.outputs.current }}" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/core/go.sum

      - name: Build
        working-directory: apps/core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w -X main.version=${{ needs.version.outputs.next }}" \
            -o ../../dist/smokery-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} ./cmd/smokery

      - uses: actions/upload-artifact@v4
        with:
          name: smokery-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.next }}
          generate_release_notes: true
          files: dist/*
